appId: com.xssh.app
productName: kTerminal
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!scripts/*'
  - '!.github/*'
asarUnpack:
  - resources/**
  - node_modules/@lydell/**
win:
  executableName: kTerminal
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createStartMenuShortcut: true
  artifactName: kTerminal-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  category: public.app-category.developer-tools
  # Used by the zip target; dmg sets its own name below.
  artifactName: ${productName}-${version}-${arch}-mac.${ext}
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  # No Apple Developer ID: ad-hoc sign so the app still launches on Apple silicon. Hardened runtime
  # is only needed for notarization, and with an ad-hoc signature it makes library validation
  # reject Electron's own frameworks and native modules at launch.
  identity: '-'
  hardenedRuntime: false
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: kTerminal 需要访问"文稿"文件夹以浏览和传输文件。
    - NSDownloadsFolderUsageDescription: kTerminal 需要访问"下载"文件夹以浏览和传输文件。
    - NSDesktopFolderUsageDescription: kTerminal 需要访问"桌面"文件夹以浏览和传输文件。
  notarize: false
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  maintainer: kk1181958464 <1181958464@qq.com>
  category: Development
  synopsis: SSH 终端与 SFTP 文件传输一体化工具
appImage:
  artifactName: ${productName}-${version}-${arch}.${ext}
deb:
  artifactName: ${productName}-${version}-${arch}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: kk1181958464
  repo: kTerminal
